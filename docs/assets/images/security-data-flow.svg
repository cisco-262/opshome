<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">OpsHome NOC data flow and trust boundaries</title>
  <desc id="desc">The iPhone App connects to OpsHome Cloud over HTTPS. Docker Probe inside the user's private LAN initiates an outbound HTTPS connection to the cloud and reaches only authorized private services. OpsHome Cloud performs public service checks.</desc>
  <defs>
    <linearGradient id="cloud" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#eaf4ff"/><stop offset="1" stop-color="#dbeafe"/></linearGradient>
    <linearGradient id="lan" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f0fdf4"/><stop offset="1" stop-color="#ecfdf5"/></linearGradient>
    <linearGradient id="public" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#fffbeb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0b1b2e" flood-opacity=".12"/></filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#1479ff"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#059669"/></marker>
    <marker id="arrow-gold" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#d97706"/></marker>
    <style>
      .title{font:700 26px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#0b1b2e}
      .body{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#475569}
      .small{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#475569;letter-spacing:.02em}
      .zone{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#64748b;letter-spacing:.14em;text-transform:uppercase}
    </style>
  </defs>
  <rect width="1200" height="690" rx="24" fill="#f7fbff"/>
  <text x="600" y="42" text-anchor="middle" class="zone">DATA FLOW &amp; TRUST BOUNDARIES</text>

  <g>
    <rect x="55" y="88" width="260" height="126" rx="18" fill="#fff" stroke="#9cc9f6" stroke-width="2"/>
    <text x="185" y="136" text-anchor="middle" class="title">iPhone App</text>
    <text x="185" y="168" text-anchor="middle" class="body">Status, alerts, history</text>
  </g>

  <g>
    <rect x="420" y="78" width="360" height="146" rx="20" fill="url(#cloud)" stroke="#8b5cf6" stroke-width="2"/>
    <text x="600" y="132" text-anchor="middle" class="title">OpsHome Cloud</text>
    <text x="600" y="165" text-anchor="middle" class="body">API, public checks, service data</text>
  </g>

  <g>
    <rect x="885" y="88" width="260" height="126" rx="18" fill="url(#public)" stroke="#f2b84b" stroke-width="2"/>
    <text x="1015" y="136" text-anchor="middle" class="title">Public Services</text>
    <text x="1015" y="168" text-anchor="middle" class="body">Websites, APIs, TLS, DNS</text>
  </g>

  <path d="M315 151H410" fill="none" stroke="#1479ff" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="362" y="135" text-anchor="middle" class="small">HTTPS</text>
  <path d="M790 151H875" fill="none" stroke="#d97706" stroke-width="4" marker-end="url(#arrow-gold)"/>
  <text x="832" y="122" text-anchor="middle" class="small">Public checks</text>

  <rect x="55" y="300" width="1090" height="328" rx="24" fill="url(#lan)" stroke="#54b889" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="84" y="340" class="zone" fill="#047857">YOUR PRIVATE NETWORK</text>
  <text x="84" y="369" class="body">The Probe reaches only targets you authorize.</text>

  <g>
    <rect x="105" y="425" width="330" height="134" rx="18" fill="#fff" stroke="#54b889" stroke-width="2"/>
    <text x="270" y="472" text-anchor="middle" class="title">Docker Probe</text>
    <text x="270" y="504" text-anchor="middle" class="body">Runs inside your LAN</text>
    <text x="270" y="531" text-anchor="middle" class="body">Outbound-only HTTPS</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="685" y="425" width="390" height="134" rx="18" fill="#fff" stroke="#54b889" stroke-width="2"/>
    <text x="880" y="472" text-anchor="middle" class="title">Authorized Private Services</text>
    <text x="880" y="504" text-anchor="middle" class="body">PVE, Synology, Docker, Linux</text>
    <text x="880" y="531" text-anchor="middle" class="body">HTTP, HTTPS, TCP, asset state</text>
  </g>
  <path d="M435 492H675" fill="none" stroke="#059669" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="555" y="474" text-anchor="middle" class="small">Local authorized access</text>
  <path d="M270 416V240" fill="none" stroke="#059669" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="430" y="326" class="small">Probe-initiated</text>
  <text x="430" y="347" class="small">outbound HTTPS</text>
  <path d="M430 246C400 276 360 291 320 300" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="6 6"/>

  <rect x="420" y="580" width="360" height="34" rx="17" fill="#dcfce7"/>
  <text x="600" y="602" text-anchor="middle" class="small" fill="#047857">No inbound port forwarding required</text>
</svg>

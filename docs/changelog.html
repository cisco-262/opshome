<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="0; url=https://docs.opshome.run/release-notes.html">
<title>Release Notes - OpsHome Docs</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://docs.opshome.run/release-notes.html">
<style>
  :root{--accent:#1479ff;--text:#0b1b2e;--muted:#334155;--border:#d7e8f8}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6fbff;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  main{width:min(560px,calc(100% - 40px));padding:32px;border:1px solid var(--border);border-radius:18px;background:#fff;text-align:left;box-shadow:0 20px 48px rgba(31,91,150,.12)}
  h1{margin:0 0 12px;font-size:28px;line-height:1.15}
  p{margin:0 0 22px;color:var(--muted);line-height:1.6}
  a{display:inline-flex;padding:12px 18px;border:1px solid var(--accent);border-radius:12px;background:var(--accent);color:#fff;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<main>
  <h1>Release notes moved to OpsHome Docs.</h1>
  <p>The main site no longer hosts changelog content. You will be redirected to the docs site automatically.</p>
  <a href="https://docs.opshome.run/release-notes.html">Open Release Notes</a>
</main>
</body>
</html>
